name: security-assessment

x-app-env: &app-env
  POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set it in .env}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set it in .env}

services:
  api:
    build: ./backend
    image: security-assessment-backend
    environment: *app-env
    ports:
      # Localhost only: the API has no authentication yet.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: security-assessment-backend
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: the temporary server used during first init listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: rabbitmq:4-management-alpine
    # RabbitMQ names its data directory after the host, so it must survive recreation.
    hostname: queue
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set it in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set it in .env}
    volumes:
      - queue-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  db-data:
  queue-data:
